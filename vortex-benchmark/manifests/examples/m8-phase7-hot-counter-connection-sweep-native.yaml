schema_version: 1
name: m8-phase7-hot-counter-connection-sweep-native
description: Native Vortex-only custom-rust hot-counter connection-count isolation for M8 Phase 7.
databases:
  - vortex
backends:
  - custom-rust
workloads:
  - hot_counter
duration: 10s
repeat: 1
environment:
  mode: native
  port_base: 18979
resource_config:
  cpus: 4
  memory: 2g
  threads: 1
runtime_config:
  aof_enabled: false
  eviction_policy: noeviction
  maxmemory: 1800mb
  io_backend: polling
  telemetry_mode: minimal
settings:
  custom-rust:
    profile: release
    thread_sweep:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
    pipeline_depth: 16
    keyspace_size: 2
    ops_per_thread: 30000
    warmup_ops: 1000
    value_size: 16
