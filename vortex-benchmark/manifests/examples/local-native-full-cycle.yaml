schema_version: 1
name: local-native-full-cycle
description: Native local developer cycle that exercises Vortex and Redis across redis-benchmark, memtier_benchmark, and custom-rust.
databases:
  - vortex
  - redis
backends:
  - redis-benchmark
  - memtier_benchmark
  - custom-rust
commands:
  - GET
  - SET
  - INCR
workloads:
  - uniform-read_heavy
  - multi_key_only
duration: 10s
environment:
  mode: native
  port_base: 17679
resource_config:
  cpus: 4
  memory: 2g
  threads: 4
  # Pin service/load to separate physical P-cores on the local alpha host.
  # Avoid 0-3 style masks here: on hybrid/SMT CPUs that can place four
  # "threads" onto only two physical cores and create invalid Redis deltas.
  service_cpus: "0,2,4,6"
  load_cpus: "8,10,12,14"
runtime_config:
  aof_enabled: false
  eviction_policy: noeviction
  telemetry_mode: minimal
  io_backend: uring
  fixed_buffers: 1024
  fixed_buffer_registration: auto
  sqpoll_idle_ms: 0
settings:
  redis-benchmark:
    requests: 30000
    clients: 100
    pipeline: 1
    keyspace_size: 100000
  memtier_benchmark:
    clients: 100
    pipeline: 1
    keyspace_size: 100000
    data_size: 256
    thread_sweep:
      - 1
      - 4
      - 8
  custom-rust:
    profile: release
    thread_sweep:
      - 1
      - 4
      - 8
    keyspace_size: 50000
    ops_per_thread: 6000
    warmup_ops: 500
    value_size: 64
