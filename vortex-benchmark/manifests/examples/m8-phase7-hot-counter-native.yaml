schema_version: 1
name: m8-phase7-hot-counter-native
description: Native Phase 7 M8 semantic-counter candidate matrix using p99.9-capable custom-rust workloads.
databases:
  - vortex
  - redis
backends:
  - custom-rust
workloads:
  - hot_counter
  - hot_counter_with_get
  - hot_counter_with_set_del
  - hot_counter_ttl
  - hot_counter_transaction
  - hot_counter_watch_transaction
  - hot_counter_multikey
duration: 10s
repeat: 3
environment:
  mode: native
  port_base: 18479
resource_config:
  cpus: 4
  memory: 2g
  threads: 4
runtime_config:
  aof_enabled: false
  eviction_policy: noeviction
  telemetry_mode: minimal
settings:
  custom-rust:
    profile: release
    thread_sweep:
      - 1
      - 4
      - 8
    keyspace_size: 2
    ops_per_thread: 20000
    warmup_ops: 1000
    value_size: 16
