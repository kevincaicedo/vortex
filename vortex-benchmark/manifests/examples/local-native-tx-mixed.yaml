schema_version: 1
name: local-native-tx-mixed
description: Native local transaction mix for validating sorted-shard EXEC against Redis with custom Rust loadgen.
databases:
  - vortex
  - redis
backends:
  - custom-rust
workloads:
  - single_key_tx_mixed
  - multi_key_tx_mixed
duration: 8s
environment:
  mode: native
  port_base: 17879
resource_config:
  cpus: 4
  memory: 2g
  threads: 4
runtime_config:
  aof_enabled: false
  eviction_policy: noeviction
settings:
  custom-rust:
    profile: release
    thread_sweep:
      - 1
      - 4
    keyspace_size: 50000
    ops_per_thread: 6000
    warmup_ops: 500
    value_size: 64
