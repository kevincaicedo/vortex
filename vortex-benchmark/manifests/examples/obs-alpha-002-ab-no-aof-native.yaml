schema_version: 1
name: obs-alpha-002-ab-no-aof-native
description: OBS-ALPHA-002 telemetry mode A/B rows without AOF, pipeline 1.
databases:
  - vortex
backends:
  - redis-benchmark
  - memtier_benchmark
  - custom-rust
commands:
  - PING
  - GET
  - SET
workloads:
  - uniform-read_heavy
  - pressure-deep_pipeline
duration: 5s
environment:
  mode: native
  port_base: 18479
resource_config:
  cpus: 4
  memory: 2g
  threads: 4
runtime_config:
  aof_enabled: false
  eviction_policy: noeviction
settings:
  redis-benchmark:
    requests: 20000
    clients: 64
    pipeline: 1
    keyspace_size: 100000
  memtier_benchmark:
    clients: 64
    pipeline: 1
    keyspace_size: 100000
    data_size: 256
    thread_sweep:
      - 4
  custom-rust:
    profile: release
    thread_sweep:
      - 4
    keyspace_size: 50000
    ops_per_thread: 3000
    warmup_ops: 500
    value_size: 64
