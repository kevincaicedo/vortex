schema_version: 1
name: workstream-e-rb-multikey-polling-svc8-pinned
description: Focused Workstream E redis-benchmark multi-key slice with service and load affinity separated on the local Linux alpha host.
databases:
  - vortex
  - redis
backends:
  - redis-benchmark
commands:
  - MGET
  - MSET
  - MSETNX
duration: 10s
repeat: 10
environment:
  mode: native
  port_base: 16379
resource_config:
  cpus: 8
  memory: 2g
  threads: 8
  service_cpus: "0,2,4,6,8,10,12,14"
  load_cpus: "16,17,18,19,20,21,22,23"
runtime_config:
  aof_enabled: false
  eviction_policy: noeviction
  maxmemory: 1800mb
  telemetry_mode: minimal
  io_backend: polling
  fixed_buffers: 1024
settings:
  redis-benchmark:
    requests: 100000
    clients: 100
    pipeline: 1
    keyspace_size: 100000
