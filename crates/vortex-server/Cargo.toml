[package]
name = "vortex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VortexDB server binary"

[[bin]]
name = "vortex-server"
path = "src/main.rs"

[lints.rust]
unsafe_code = "allow"

[features]
default = []
lock-profile = ["vortex-engine/lock-profile", "vortex-io/lock-profile"]
sqpoll = ["vortex-io/sqpoll"]
profile-telemetry = [
    "vortex-config/profile-telemetry",
    "vortex-engine/profile-telemetry",
    "vortex-io/profile-telemetry",
    "vortex-persist/profile-telemetry",
]

[dependencies]
vortex-common = { workspace = true }
vortex-memory = { workspace = true }
vortex-config = { workspace = true }
vortex-io = { workspace = true }
vortex-persist = { workspace = true }
vortex-engine = { workspace = true }
tikv-jemallocator = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctrlc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
vortex-io = { workspace = true, features = ["io-uring"] }
