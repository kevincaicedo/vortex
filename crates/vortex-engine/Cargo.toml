[package]
name = "vortex-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VortexDB core data engine — Swiss Table, shard, commands, data structures"
autoexamples = false

[features]
default = ["simd"]
simd = []
profiling-tools = ["dep:clap", "dep:tikv-jemallocator"]

[lints.rust]
unsafe_code = "allow"

[dependencies]
vortex-common = { workspace = true }
vortex-proto = { workspace = true }
vortex-memory = { workspace = true }
vortex-sync = { workspace = true }
ahash = { workspace = true }
crossbeam-utils = { workspace = true }
parking_lot = { workspace = true }
itoa = { workspace = true }
ryu = { workspace = true }
bytes = { workspace = true }
smallvec = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
tikv-jemalloc-sys = { workspace = true }
libc = { workspace = true }
clap = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
hdrhistogram = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "table"
harness = false

[[example]]
name = "engine_probe"
path = "examples/engine_probe.rs"
required-features = ["profiling-tools"]
